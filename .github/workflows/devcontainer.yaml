name: Devcontainer
on:
  workflow_dispatch:
  pull_request:
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yaml"]
  push:
    branches: [main]
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yaml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build development image locally
        run: docker build --tag gnash-devcontainer:check .devcontainer
