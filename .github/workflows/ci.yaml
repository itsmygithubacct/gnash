name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev bash-completion bsdextrautils locales
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install dependency auditor
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2
      - name: Install workflow linter
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz
          printf '%s  %s\n' \
            900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/actionlint.tar.gz" \
            --directory "$RUNNER_TEMP" actionlint
      - name: Check workflows
        run: '"$RUNNER_TEMP/actionlint"'
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-features --all-targets
      - name: Test workspace and shell compatibility
        run: cargo test --locked --workspace
      - name: Check generated schemas
        run: cargo xtask check schemas
      - name: Check dependencies
        run: cargo deny --all-features check all
      - name: Verify pinned upstream sources
        run: python3 scripts/vendor-bash-os.py
      - name: Build release layout and collect license notices
        run: python3 scripts/build-gnash.py --release
      - name: Package and test relocated release
        run: |
          python3 scripts/package-gnash.py create
          python3 scripts/package-gnash.py verify out/dist/*.tar.gz
      - name: Upload complete release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnash-x86_64-unknown-linux-gnu
          path: |
            out/dist/*.tar.gz
            out/dist/*.sha256
          if-no-files-found: error
